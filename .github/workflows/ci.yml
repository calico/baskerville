name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          activate-environment: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bedtools
      # CPU torch wheels: the default CUDA wheels overflow the runner disk.
      - run: uv pip install --torch-backend cpu -e ".[dev]"
      - run: pytest -m "not slow"

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.15 format --check .

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3.8.2 --check .
